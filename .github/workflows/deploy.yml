
name: Snowflake DWH CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'migrations/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schemachange
        run: pip install schemachange

      - name: Deploy Snowflake migrations
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ACCOUNTADMIN
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: DWH_MIGRATION_TEST_DB
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
            schemachange deploy \
                --schemachange-root-folder migrations \
                --schemachange-vars '{"DB_NAME":"DWH_MIGRATION_TEST_DB"}' \
                --schemachange-change-history-table DWH_MIGRATION_TEST_DB.SQL_PRACTICE.SCHEMACHANGE_CHANGE_HISTORY \
                --schemachange-create-change-history-table \
                 --schemachange-dry-run